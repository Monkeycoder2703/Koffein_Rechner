<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Auf GitHub Pages gibt es keine Server-Header: CSP hier. Erlaubt nur dieselbe Seite und Supabase. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">

</head>
<body class="booting">

  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>

</svg>

<div id="bg" aria-hidden="true"><i class="dots"></i><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i><i class="grain"></i><i class="strobe s1"></i><i class="strobe s2"></i><i class="scan"></i></div>

<div id="boot" aria-hidden="true"><div class="boot-mark"><svg class="ico"><use href="#i-coffee"/></svg></div></div>

<header class="top">
  <a class="brand" href="./" data-i18n-aria="brand_aria">
    <span class="brand-mark"><svg class="ico"><use href="#i-coffee"/></svg></span><span data-i18n="brand"></span>
  </a>
  <div class="tools">
    <button id="chaos" class="chaos-btn" type="button" hidden aria-pressed="false" data-locked="true" data-i18n-aria="chaos_aria">
      <svg class="ico"><use href="#i-zap"/></svg><span id="chaos-t" data-i18n="chaos_btn"></span><svg class="ico lockico"><use href="#i-lock"/></svg><i class="unlock-bar"></i>
    </button>
    <button id="lang" class="icon-btn lang-btn" type="button"><span id="lang-t">EN</span></button>
    <div id="userbox" hidden>
      <span class="chip"><svg class="ico"><use href="#i-user"/></svg><span id="who"></span></span>
      <button id="logout" class="icon-btn" type="button" data-i18n-aria="logout" data-tip><svg class="ico"><use href="#i-logout"/></svg></button>
    </div>
  </div>
</header>

<!-- ============ Anmelden ============ -->
<main id="auth-view" class="auth" hidden>
  <section class="auth-hero">
    <p class="eyebrow"><svg class="ico"><use href="#i-flame"/></svg><span data-i18n="eyebrow"></span></p>
    <h1 class="display"><span data-i18n="h1a"></span><br><span data-i18n="h1b"></span> <span class="hl" data-i18n="h1c"></span></h1>
    <div class="hero-row">
      <div id="hero-cup" class="hero-cup cup cup--demo"></div>
      <ul class="points">
        <li><span class="pt-ico"><svg class="ico"><use href="#i-coffee"/></svg></span><div><b data-i18n="pt1_t"></b><span class="t" data-i18n="pt1_x"></span></div></li>
        <li><span class="pt-ico"><svg class="ico"><use href="#i-shield"/></svg></span><div><b data-i18n="pt2_t"></b><span class="t" data-i18n="pt2_x"></span></div></li>
        <li><span class="pt-ico"><svg class="ico"><use href="#i-trophy"/></svg></span><div><b data-i18n="pt3_t"></b><span class="t" data-i18n="pt3_x"></span></div></li>
      </ul>
    </div>
  </section>

  <div class="auth-panel">
    <section class="panel" id="card-login">
      <h2 id="auth-title" data-i18n="auth_title_login"></h2>
      <p class="sub" id="auth-sub" data-i18n="auth_sub_login"></p>
      <form id="auth-form" novalidate>
        <div class="field"><label for="e" data-i18n="email"></label><input id="e" type="email" required maxlength="254" autocomplete="email" data-i18n-ph="email_ph"></div>
        <div class="field" id="user-row" hidden><label for="u" data-i18n="username"></label><input id="u" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="nickname" data-i18n-ph="username_ph"><small data-i18n="username_hint"></small></div>
        <div class="field"><label for="p" data-i18n="password"></label>
          <div class="pw"><input id="p" type="password" required minlength="10" maxlength="72" autocomplete="current-password" data-i18n-ph="password_ph">
            <button class="icon-btn" type="button" data-toggle-pw="p" data-i18n-aria="show_pw"><svg class="ico"><use href="#i-eye"/></svg></button></div>
          <div id="strength" class="strength" data-s="0" hidden><i></i><i></i><i></i><i></i></div>
        </div>
        <input id="hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
        <p id="auth-msg" class="msg" role="alert"></p>
        <button type="submit" id="auth-btn" class="btn block"><span id="auth-btn-t" data-i18n="btn_login"></span></button>
      </form>
      <div class="auth-links">
        <button id="toggle" class="link" type="button" data-i18n="toggle_to_reg"></button>
        <button id="forgot-link" class="link" type="button" data-i18n="forgot_link"></button>
      </div>
      <p class="fine" data-i18n="fine_email"></p>
    </section>

    <section class="panel" id="card-forgot" hidden>
      <h2 data-i18n="forgot_title"></h2>
      <p class="sub" data-i18n="forgot_sub"></p>
      <form id="forgot-form">
        <div class="field"><label for="fe" data-i18n="email"></label><input id="fe" type="email" required maxlength="254" autocomplete="email" data-i18n-ph="email_ph"></div>
        <p id="forgot-msg" class="msg" role="alert"></p>
        <button type="submit" class="btn block"><span data-i18n="send_link"></span></button>
      </form>
      <div class="auth-links"><button class="link back" type="button" data-i18n="back_login"></button></div>
    </section>

    <section class="panel" id="card-reset" hidden>
      <h2 data-i18n="reset_title"></h2>
      <p class="sub" data-i18n="reset_sub"></p>
      <form id="reset-form">
        <div class="field"><label for="rp" data-i18n="new_pw"></label>
          <div class="pw"><input id="rp" type="password" required minlength="10" maxlength="72" autocomplete="new-password">
            <button class="icon-btn" type="button" data-toggle-pw="rp" data-i18n-aria="show_pw"><svg class="ico"><use href="#i-eye"/></svg></button></div></div>
        <p id="reset-msg" class="msg" role="alert"></p>
        <button type="submit" class="btn block"><span data-i18n="save_pw"></span></button>
      </form>
    </section>

    <section class="panel" id="card-done" hidden>
      <div class="done">
        <div class="done-ico"><svg class="ico"><use href="#i-mail"/></svg></div>
        <h2 data-i18n="done_title"></h2>
        <p class="sub" data-i18n="done_sub"></p>
        <button class="btn ghost back" type="button"><svg class="ico"><use href="#i-back"/></svg><span data-i18n="to_login"></span></button>
      </div>
    </section>
  </div>
</main>

<!-- ============ App ============ -->
<main id="app-view" class="app" hidden>
  <nav class="tabs" id="main-tabs" role="tablist" data-i18n-aria="tabs_aria">
    <span class="tab-ind" aria-hidden="true"></span>
    <button role="tab" aria-selected="true" data-tab="dash" type="button"><svg class="ico"><use href="#i-coffee"/></svg><span data-i18n="tab_today"></span></button>
    <button role="tab" aria-selected="false" data-tab="board" type="button"><svg class="ico"><use href="#i-trophy"/></svg><span data-i18n="tab_board"></span></button>
    <button role="tab" aria-selected="false" data-tab="suggest" type="button"><svg class="ico"><use href="#i-bulb"/></svg><span data-i18n="tab_suggest"></span></button>
    <button role="tab" aria-selected="false" data-tab="account" type="button"><svg class="ico"><use href="#i-user"/></svg><span data-i18n="tab_account"></span></button>
  </nav>

  <section id="tab-dash" class="tab">
    <div class="dash is-loading" id="dash">
      <div class="stage">
        <div id="cup" class="cup"></div>
        <div class="reading"><span class="big" id="total">0</span><span class="unit">mg</span></div>
        <p class="left-line" id="left-line"><span id="ll-pre"></span><b id="remaining">400</b><span id="ll-post"></span></p>
        <div class="track" id="track" role="progressbar" aria-valuemin="0" aria-valuemax="400" aria-valuenow="0" data-i18n-aria="progress_aria"><i id="fill"></i></div>
        <p class="pill" id="pill"><svg class="ico"><use href="#i-sun"/></svg><span id="warn"></span></p>
      </div>

      <div>
        <div class="sec-h"><h2 data-i18n="what_drink"></h2></div>
        <div id="drinks" class="drinks" role="radiogroup" data-i18n-aria="pick_aria"></div>
        <div class="sizes" id="sizes" hidden>
          <div class="sec-h"><h3 data-i18n="size_h"></h3><small id="size-name"></small></div>
          <div class="size-grid" id="size-grid" role="radiogroup" data-i18n-aria="size_h"></div>
        </div>
        <div class="addbar">
          <p class="sel-sum" id="preview" aria-live="polite"></p>
          <button id="add" class="btn" type="button" disabled><svg class="ico"><use href="#i-plus"/></svg><span data-i18n="add"></span></button>
        </div>

        <div class="sec-h today"><h2 data-i18n="today_h"></h2><small id="count"></small></div>
        <ul id="list" class="log"></ul>
      </div>
    </div>
  </section>

  <section id="tab-board" class="tab narrow" hidden>
    <div class="sec-h"><h2 data-i18n="board_h"></h2><small data-i18n="board_sub"></small></div>
    <div class="tabs seg" id="seg" role="tablist" data-i18n-aria="seg_aria">
      <span class="tab-ind" aria-hidden="true"></span>
      <button role="tab" aria-selected="true" data-p="day" type="button" data-i18n="p_day"></button>
      <button role="tab" aria-selected="false" data-p="week" type="button" data-i18n="p_week"></button>
      <button role="tab" aria-selected="false" data-p="month" type="button" data-i18n="p_month"></button>
    </div>
    <div id="board"></div>
  </section>

  <section id="tab-suggest" class="tab narrow" hidden>
    <div class="panel">
      <h2 data-i18n="sg_title"></h2>
      <p class="sub" data-i18n="sg_sub"></p>
      <form id="sg-form">
        <div class="field"><label for="sg-name" data-i18n="sg_name"></label><input id="sg-name" required maxlength="60" data-i18n-ph="sg_name_ph"></div>
        <div class="field"><label for="sg-portion" data-i18n="sg_portion"></label><input id="sg-portion" required maxlength="30" data-i18n-ph="sg_portion_ph"></div>
        <div class="field"><label for="sg-mg" data-i18n="sg_mg"></label><input id="sg-mg" type="number" min="0" max="1000" required inputmode="numeric" data-i18n-ph="sg_mg_ph"><small data-i18n="sg_mg_hint"></small></div>
        <p id="sg-msg" class="msg" role="alert"></p>
        <button type="submit" class="btn block"><svg class="ico"><use href="#i-send"/></svg><span data-i18n="sg_send"></span></button>
      </form>
    </div>
  </section>

  <section id="tab-account" class="tab narrow" hidden>
    <div class="panel">
      <h2 data-i18n="acc_title"></h2>
      <p class="sub"><span data-i18n="acc_as"></span><b id="who2"></b></p>
      <button id="logout2" class="btn ghost block" type="button"><svg class="ico"><use href="#i-logout"/></svg><span data-i18n="logout"></span></button>
      <hr class="div">
      <h3 data-i18n="mus_title"></h3>
      <p class="sub" data-i18n="mus_sub"></p>
      <div class="field"><label for="pl-select" data-i18n="mus_pl"></label><select id="pl-select"></select></div>
      <form id="nsfw-form" autocomplete="off">
        <div class="field"><label for="nsfw-code" data-i18n="mus_code"></label><input id="nsfw-code" type="password" maxlength="40" autocomplete="off" spellcheck="false"></div>
        <p id="nsfw-msg" role="status"></p>
        <button class="btn ghost block" type="submit" id="nsfw-go"><svg class="ico"><use href="#i-lock"/></svg><span data-i18n="mus_unlock"></span></button>
      </form>
      <button id="nsfw-lock" class="btn ghost block" type="button" hidden><svg class="ico"><use href="#i-lock"/></svg><span data-i18n="mus_lock"></span></button>
      <hr class="div">
      <div id="fx-box" hidden>
        <h3 data-i18n="fx_title"></h3>
        <p class="sub" data-i18n="fx_hint"></p>
        <button id="fx-toggle" class="btn ghost block" type="button"></button>
      </div>
      <hr class="div">
      <h3 class="danger-t" data-i18n="del_title"></h3>
      <p class="sub" data-i18n="del_sub"></p>
      <button id="del-open" class="btn danger block" type="button"><svg class="ico"><use href="#i-trash"/></svg><span data-i18n="del_open"></span></button>
    </div>
  </section>
</main>

<dialog id="del-dialog" aria-labelledby="del-title">
  <form id="del-form" method="dialog">
    <h3 id="del-title" data-i18n="dlg_title"></h3>
    <p data-i18n="dlg_text"></p>
    <div class="field"><label for="del-pw" data-i18n="password"></label><input id="del-pw" type="password" required maxlength="72" autocomplete="current-password"></div>
    <p id="del-msg" class="msg" role="alert"></p>
    <div class="row">
      <button type="button" id="del-cancel" class="btn ghost"><span data-i18n="cancel"></span></button>
      <button type="submit" class="btn danger"><span data-i18n="del_confirm"></span></button>
    </div>
  </form>
</dialog>

<dialog id="chaos-dialog" aria-labelledby="chaos-title">
  <form method="dialog">
    <h3 id="chaos-title" data-i18n="warn_title"></h3>
    <p data-i18n="warn_text"></p>
    <div class="row">
      <button type="button" id="chaos-cancel" class="btn ghost"><span data-i18n="cancel"></span></button>
      <button type="button" id="chaos-go" class="btn"><svg class="ico"><use href="#i-zap"/></svg><span data-i18n="warn_go"></span></button>
    </div>
  </form>
</dialog>

<div id="loader" aria-live="polite" aria-hidden="true">
  <div class="ld">
    <div class="pour cup" id="ld-cup"></div>
    <p class="ld-kicker"><svg class="ico"><use href="#i-pulse"/></svg><span data-i18n="ld_kicker"></span></p>
    <div class="ld-fact" id="ld-fact"></div>
    <div class="ld-bar"><i></i></div>
  </div>
</div>

<div id="ticker" class="ticker" aria-hidden="true"><div class="tk" id="tk"></div></div>
<div id="player" hidden>
  <svg class="ico"><use href="#i-music"/></svg><span class="np" id="np"></span>
  <button id="mute" class="icon-btn" type="button" data-i18n-aria="music_mute" data-tip><svg class="ico"><use href="#i-volume"/></svg></button>
  <button id="skip" class="icon-btn" type="button" data-i18n-aria="music_next" data-tip><svg class="ico"><use href="#i-skip"/></svg></button>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<div id="eq" aria-hidden="true"></div>

<script src="supabase.js"></script>
<script src="config.js?v=20261113e"></script>
<script src="i18n.js?v=20261113e"></script>
<script src="chaos.js?v=20261113e"></script>
<script src="water.js?v=20261113e"></script>
<script src="ui.js?v=20261113e"></script>
<script src="pwa.js?v=20261113e"></script>
<script src="app.js?v=20261113e"></script>
</body>
</html>
